<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Received — Leno Sushi</title>
  <meta name="description" content="Thank you for your order at Leno Sushi" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1220;
      --card: #14182b;
      --muted: #8ea0b6;
      --text: #eef3ff;
      --accent: #3dd6a6;
      --accent-2: #66a8ff;
      --border: #27324a;
      --radius: 16px;
      --shadow: 0 10px 25px rgba(0,0,0,.25);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 700px at 80% -10%, #1a2140, #0f1220), var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height: 1.5;
    }
    .wrap {
      max-width: 600px;
      margin: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    a { color: var(--accent-2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 800;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid rgba(61,214,166,.3);
      background: linear-gradient(180deg, rgba(61,214,166,.25), rgba(61,214,166,.15));
      color: #eafff8;
      font-weight: 700;
      text-decoration: none;
    }
    .btn:hover {
      background: linear-gradient(180deg, rgba(61,214,166,.35), rgba(61,214,166,.25));
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="icon">&#10003;</div>
      <h1>Order Received!</h1>
      <p>Thank you for your order. We'll confirm by phone or email shortly.</p>
      <a href="/" class="btn">Back to Menu</a>
    </div>
  </div>
</body>
</html>
